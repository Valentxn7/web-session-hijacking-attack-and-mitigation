<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cookie Pwnd</title>
    </head>
    <body>

        {% if cookie %}
            {% for key, value in cookie.items() %}
                {{ key }} : {{ value }}   --- END --- <br>
            {% endfor %}
        {% else %}
            <h1 style="color:red;">Aucun cookie détecté.</h1>
        {% endif %}
    </body>
</html>
